[package]
name = "graphics-app"
version = "0.1.0"
description = "Календарь рабочих и выходных дней"
edition = "2021"

[lib]
name = "graphics_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
